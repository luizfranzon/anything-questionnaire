services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-questionnaire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questionnaire}
      POSTGRES_DB: ${POSTGRES_DB:-questionnaire}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-questionnaire}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-questionnaire}:${POSTGRES_PASSWORD:-questionnaire}@db:5432/${POSTGRES_DB:-questionnaire}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      SOURCES_DIR: /data/sources
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - sources-data:/data/sources
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
  sources-data:
